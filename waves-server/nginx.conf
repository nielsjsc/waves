
worker_processes  2;
events {
    worker_connections  1024;
}

http {
server {
    listen       5443 ssl;
    server_name  server.waves.local;

    ssl_certificate      C:/Users/eric/code/waves/security/waves-cert.pem;
    ssl_certificate_key  C:/Users/eric/code/waves/security/waves-key.pem;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    location / {
    
        if ($request_method = 'OPTIONS') {
			add_header 'Access-Control-Allow-Origin' 'https://app.waves.local' always;
			add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
			add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Origin, X-Requested-With,Keep-Alive,Connection' always;
			add_header 'Access-Control-Allow-Credentials' 'true' always;		
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		
		proxy_cache off;
		proxy_buffering off;
        chunked_transfer_encoding on;
        
        proxy_pass http://[::1]:3000;
    }	
}
server {
	listen 443 ssl;
	server_name app.waves.local;
	
	ssl_certificate      C:/Users/eric/code/waves/security/waves-cert.pem;
    ssl_certificate_key  C:/Users/eric/code/waves/security/waves-key.pem;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;
	
	location / {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	
		proxy_pass https://127.0.0.1:5173;
	}
	
	}
}